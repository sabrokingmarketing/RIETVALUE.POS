# Production-style deployment on one machine (or a small VPS).
#   cp .env.example .env   # then fill in real secrets
#   docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nursery
      POSTGRES_USER: nursery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nursery -d nursery"]
      interval: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgres://nursery:${POSTGRES_PASSWORD}@db:5432/nursery
      UPLOAD_DIR: /data/uploads
    ports:
      - "127.0.0.1:3000:3000"   # put an HTTPS reverse proxy (Caddy/nginx) in front
    volumes:
      - uploads:/data/uploads
volumes:
  dbdata:
  uploads:
