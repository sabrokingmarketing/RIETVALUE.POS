# Local development database only:  docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: nursery, POSTGRES_PASSWORD: nursery, POSTGRES_DB: nursery_dev }
    ports: ["5432:5432"]
    volumes: ["./scripts/dev-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro", "devdb:/var/lib/postgresql/data"]
volumes: { devdb: {} }
